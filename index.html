<style>
:root{
  --bg:#0c1b26; --panel:#13293d; --panel2:#1b3750; --border:#2b4d68;
  --ink:#e4edf2; --ink-dim:#8fa6b8; --sea:#4fb8a6; --sea-dim:#2f7d70;
  --orange:#d97b3f; --orange-bright:#ea9257;
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
/* Color themes: the same looks as the tracker (saved in this browser under
   dndTracker:theme). Keep these colors in step with the theme blocks in turnkeeper.html. */
html[data-theme="midnight"]{--bg:#0f0d1a; --panel:#1a1730; --panel2:#252142; --border:#3b3563; --ink:#ece8f7; --ink-dim:#a49dc4; --sea:#b7a0f2; --sea-dim:#9a84dc; --orange:#c9962f;}
html[data-theme="grove"]{--bg:#0e1712; --panel:#16241c; --panel2:#1f3327; --border:#30503c; --ink:#e8f0e3; --ink-dim:#9fb5a1; --sea:#9ccf6f; --sea-dim:#557f3d; --orange:#c47a35;}
html[data-theme="ember"]{--bg:#151011; --panel:#221a1b; --panel2:#2f2425; --border:#4b3638; --ink:#f3eae7; --ink-dim:#b9a4a1; --sea:#d9a955; --sea-dim:#8a6630; --orange:#b8433a;}
html[data-theme="daylight"]{--bg:#eef2f5; --panel:#ffffff; --panel2:#e7edf2; --border:#c3d0da; --ink:#1b2a36; --ink-dim:#5a6e7e; --sea:#1d7a6e; --sea-dim:#4aa597; --orange:#dd7d3e;}
html[data-theme="tome"]{
  --bg:#d8c39a; --panel:#f2e7cc; --panel2:#e7d7b2; --border:#b39b6d; --ink:#2b1c11; --ink-dim:#6b5237; --sea:#7d1a16; --sea-dim:#8a5a2b; --orange:#8e2a1e;
  --font-display: 'Cinzel', 'Trajan Pro', 'Book Antiqua', Georgia, serif;
  --font-body: 'EB Garamond', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
}
html[data-theme="tome"] body{background-image:radial-gradient(ellipse at 50% 0%, rgba(255,247,222,0.6), transparent 65%), radial-gradient(ellipse at 50% 100%, rgba(110,70,25,0.22), transparent 70%); background-attachment:fixed;}
html[data-theme="tome"] h1{font-variant:small-caps; letter-spacing:0.08em; font-weight:600;}
html[data-theme="keep"]{
  --bg:#1e140c; --panel:#3a2515; --panel2:#46301c; --border:#56565c; --ink:#f0e4ca; --ink-dim:#bda98a; --sea:#d9ad56; --sea-dim:#8f6a2a; --orange:#a9572a;
  --font-display: 'MedievalSharp', 'Cinzel', 'Book Antiqua', Georgia, serif;
}
html[data-theme="keep"] body{background-image:radial-gradient(ellipse at 50% 35%, transparent 35%, rgba(0,0,0,0.6) 100%), repeating-linear-gradient(90deg, rgba(0,0,0,0.45) 0 2px, rgba(255,210,150,0.04) 2px 3px, transparent 3px 170px), repeating-linear-gradient(0deg, rgba(255,215,160,0.03) 0 1px, transparent 1px 6px), linear-gradient(90deg, #21150c, #2b1b0f 50%, #21150c); background-attachment:fixed;}
html[data-theme="keep"] h1{text-shadow:0 1px 0 rgba(0,0,0,0.85), 0 0 8px rgba(217,173,86,0.18);}
html[data-theme="inferno"]{
  --bg:#0a0505; --panel:#170c0b; --panel2:#231110; --border:#4d1812; --ink:#f0dfd3; --ink-dim:#ad8d82; --sea:#ff6a2a; --sea-dim:#a8360f; --orange:#8f1510;
  --font-display: 'Pirata One', 'UnifrakturCook', 'Book Antiqua', Georgia, serif;
}
html[data-theme="inferno"] body{background-image:linear-gradient(to top, rgba(255,72,0,0.28), rgba(160,20,0,0.1) 30%, transparent 55%), radial-gradient(ellipse at 20% 110%, rgba(255,110,20,0.35), transparent 45%), radial-gradient(ellipse at 80% 115%, rgba(255,60,0,0.3), transparent 45%), radial-gradient(ellipse at 50% 0%, rgba(90,0,0,0.35), transparent 60%); background-attachment:fixed;}
html[data-theme="inferno"] body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:0.75;
  background-image:radial-gradient(circle at 20px 40px, rgba(255,170,60,0.9) 0 1.2px, transparent 2.5px), radial-gradient(circle at 150px 190px, rgba(255,110,30,0.8) 0 1.5px, transparent 3px), radial-gradient(circle at 240px 90px, rgba(255,200,90,0.7) 0 1px, transparent 2px), radial-gradient(circle at 90px 250px, rgba(255,90,20,0.8) 0 1.3px, transparent 2.6px);
  background-size:300px 300px, 300px 300px, 300px 300px, 420px 420px;
  animation:embersRise 18s linear infinite;
}
@keyframes embersRise{from{background-position:0 0, 0 0, 0 0, 0 0;} to{background-position:30px -300px, -20px -300px, 10px -300px, -40px -420px;}}
@media (prefers-reduced-motion: reduce){ html[data-theme="inferno"] body::before{animation:none;} }
html[data-theme="inferno"] h1{text-shadow:0 0 6px rgba(255,90,20,0.55), 0 0 18px rgba(200,20,0,0.35), 0 1px 0 #000; font-size:3rem;}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); display:flex; flex-direction:column; align-items:center;
  padding:64px 20px 48px;
}
.title-block{text-align:center; margin-bottom:56px;}
/* The Turnkeeper logo and name (the same mark as the character sheet's header) */
h1.brand{display:flex; align-items:center; justify-content:center; gap:14px;}
.brand-mark{width:1.25em; height:1.25em; flex:0 0 auto;}
.eyebrow-rule{width:64px; height:1px; background:var(--sea-dim); margin:0 auto 18px;}
h1{
  font-family:var(--font-display); font-weight:normal; font-size:2.6rem;
  letter-spacing:0.015em; color:var(--sea); margin:0;
}
.subtitle{
  font-family:var(--font-display); font-style:italic; color:var(--ink-dim);
  font-size:1rem; margin-top:10px;
}
.roster{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:22px; width:100%; max-width:920px;}
@media (max-width:760px){
  .roster{grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px; max-width:460px;}
  h1{font-size:2.1rem;}
}

/* ---------- Character cards, baseball-card style ----------
   Gray until hovered. On hover the portrait turns to color, the camera pushes in a little and
   a quick (under 3 s) effect plays that matches the character's class. The metallic frame
   (--frame) matches the class too. Effects are CSS layers over the still portrait; positions
   like "81% 20%" point at things in the picture (Ezlo's hand, Bel's mug), measured for this
   5:7 card shape. A short clip can replace the still: put
   <video class="card-video" src="portraits/NAME.mp4" muted playsinline preload="none"></video>
   inside .card-art and the script at the bottom plays it on hover. */
.card{
  position:relative; display:block; aspect-ratio:5/7; padding:6px; border-radius:12px; text-decoration:none;
  background:var(--frame); box-shadow:0 10px 24px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.3);
  transition:transform .25s ease, box-shadow .25s ease, opacity .25s ease;
}
.card:is(:hover, :focus-visible, .is-active){transform:translateY(-6px) scale(1.06); z-index:2; box-shadow:0 16px 30px rgba(0,0,0,0.55), 0 0 28px var(--glow), inset 0 0 0 1px rgba(255,255,255,0.4);}
.card:focus-visible{outline:2px solid var(--line); outline-offset:4px;}
.card-art{position:relative; width:100%; height:100%; overflow:hidden; border-radius:7px; background:#000; isolation:isolate;}
.card-art img, .card-video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:var(--pos, 50% 30%); transform-origin:var(--focus, 50% 35%);}
.card-art img{filter:grayscale(1) brightness(0.7) contrast(1.05); transition:filter .6s ease;}
.card-video{opacity:0; transition:opacity .25s ease; z-index:1;}
.card:is(:hover, :focus-visible, .is-active) .card-video{opacity:1;}
.card:is(:hover, :focus-visible, .is-active) .card-art img{filter:none; animation:cardPush 2.6s ease-out forwards;}
@keyframes cardPush{from{transform:scale(1);} to{transform:scale(1.07);}}
/* Inner frame line, and the name plate at the bottom: name, then race and class on a
   metallic badge in the class's frame colors */
.card-art::after{content:''; position:absolute; inset:5px; border:1px solid var(--line); border-radius:4px; z-index:5; pointer-events:none; opacity:0.6;}
.card-plate{position:absolute; left:0; right:0; bottom:0; z-index:6; padding:40px 10px 15px; text-align:center; background:linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.6) 55%, transparent);}
.card-name{font-family:var(--font-display); font-size:1.5rem; line-height:1.1; color:#fff; letter-spacing:0.02em; text-shadow:0 2px 6px #000;}
.card-sub{
  display:inline-block; margin-top:6px; padding:3px 10px; border-radius:3px;
  background:var(--frame); color:var(--tag-ink); font-size:0.6rem; font-weight:700;
  text-transform:uppercase; letter-spacing:0.12em; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,0.55);
}
/* Effect layer: hidden until hover; each effect sets its own animation below */
.card-fx{position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden;}
.card-fx > *{position:absolute; opacity:0;}
/* Particles (embers, sparks, notes): start at --x/--y, drift by --dx/--dy over --d after --t */
.fx-p{left:var(--x); top:var(--y); width:var(--s, 5px); height:var(--s, 5px); border-radius:50%;}
.card:is(:hover, :focus-visible, .is-active) .fx-p{animation:fxRise var(--d, 2s) ease-out var(--t, 0s) forwards;}
@keyframes fxRise{
  0%{opacity:0; transform:translate(0, 0) scale(0.6) rotate(0deg);}
  15%{opacity:1;}
  100%{opacity:0; transform:translate(var(--dx, 0px), var(--dy, -120px)) scale(1) rotate(var(--r, 0deg));}
}
/* A four-point twinkle (Venthor's steel, Bel's clink) */
.fx-star{left:var(--x); top:var(--y); width:28px; height:28px; margin:-14px 0 0 -14px; background:var(--star, #fff); clip-path:polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%); filter:drop-shadow(0 0 5px var(--star, #fff));}
.card:is(:hover, :focus-visible, .is-active) .fx-star{animation:twinkle .65s ease-out var(--t, 1s) forwards;}
@keyframes twinkle{0%{opacity:0; transform:scale(0) rotate(0deg);} 40%{opacity:1; transform:scale(1.25) rotate(45deg);} 100%{opacity:0; transform:scale(0.4) rotate(90deg);}}

/* Krunk, Vengeance Paladin: gold frame; a radiant flash off the sword, the impact of the
   swing (a short shake) and embers rising from the broken floor */
.card-paladin{--frame:linear-gradient(135deg, #fff4c2, #c9982f 22%, #fff1b8 45%, #9a6b17 70%, #f3d27a); --glow:rgba(255,214,110,0.75); --line:#f5d98a; --tag-ink:#3b2604; --pos:48% 30%; --focus:54% 30%;}
.card-paladin .fx-flash{inset:-25%; background:radial-gradient(circle at 20% 28%, rgba(255,252,225,0.95), rgba(255,205,95,0.55) 14%, transparent 38%);}
.card-paladin:is(:hover, :focus-visible, .is-active) .fx-flash{animation:palFlash 1.8s ease-out 0.1s forwards;}
@keyframes palFlash{0%{opacity:0; transform:scale(0.7);} 18%{opacity:1; transform:scale(1.05);} 55%{opacity:0.35;} 100%{opacity:0.18; transform:scale(1.1);}}
.card-paladin:is(:hover, :focus-visible, .is-active) .card-art{animation:palShake 0.45s ease-in-out 0.25s;}
@keyframes palShake{0%, 100%{transform:translate(0, 0);} 20%{transform:translate(-3px, 2px);} 40%{transform:translate(3px, -2px);} 60%{transform:translate(-2px, 1px);} 80%{transform:translate(1px, -1px);}}
/* The greatsword glows like Ezlo's flame: a light laid along the blade (from his hands at
   48% 9% to the tip at the left edge, 30% down: about 56% of the card's width at 147°) that
   flares and pulses, with a shine running down it toward the tip */
.card-paladin .fx-blade{
  left:48%; top:9%; width:58%; height:3.8%; transform-origin:0 50%; transform:translateY(-50%) rotate(147deg);
  border-radius:999px; mix-blend-mode:screen; overflow:hidden;
  background:linear-gradient(90deg, rgba(255,250,225,0.95), rgba(255,222,130,0.85) 55%, rgba(255,185,70,0.15));
  box-shadow:0 0 14px 5px rgba(255,205,95,0.75), 0 0 30px 10px rgba(255,170,60,0.35);
}
.card-paladin:is(:hover, :focus-visible, .is-active) .fx-blade{animation:palBlade 2.6s ease-out forwards;}
@keyframes palBlade{0%{opacity:0; filter:brightness(1);} 18%{opacity:1; filter:brightness(1.6);} 38%{opacity:0.65; filter:brightness(1);} 58%{opacity:1; filter:brightness(1.35);} 100%{opacity:0.85; filter:brightness(1.1);}}
.card-paladin .fx-blade::after{content:''; position:absolute; top:0; bottom:0; left:0; width:28%; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent); transform:translateX(-120%);}
.card-paladin:is(:hover, :focus-visible, .is-active) .fx-blade::after{animation:bladeShine 0.8s ease-in 0.55s forwards;}
@keyframes bladeShine{to{transform:translateX(420%);}}
.card-paladin .fx-p{background:radial-gradient(circle, #fff3c0, #ff9a2a 60%, transparent 72%); box-shadow:0 0 6px #ffb347;}

/* Venthor, Assassin Rogue: gunmetal frame with square corners; shadows close in, smoke rises,
   and a flash of steel cuts across the card with a glint at his hand */
.card-rogue{--frame:linear-gradient(135deg, #6b766a, #1a1d1a 25%, #8a9488 48%, #0e100e 72%, #56604f); --glow:rgba(150,210,150,0.45); --line:#a9c2a2; --tag-ink:#e6eee3; --pos:50% 30%; --focus:54% 30%; border-radius:3px;}
.card-rogue .card-art{border-radius:1px;}
.card-rogue .card-art::after{border-radius:0;}
.card-rogue .fx-shade{inset:0; box-shadow:inset 0 0 70px 30px rgba(0,0,0,0.9);}
.card-rogue:is(:hover, :focus-visible, .is-active) .fx-shade{animation:rogShade 2.4s ease forwards;}
@keyframes rogShade{0%{opacity:0;} 40%{opacity:1;} 100%{opacity:0.55;}}
.card-rogue .fx-smoke{left:var(--x); bottom:-12%; width:75%; height:45%; background:radial-gradient(ellipse, rgba(205,215,205,0.38), transparent 65%); filter:blur(6px);}
.card-rogue:is(:hover, :focus-visible, .is-active) .fx-smoke{animation:rogSmoke 2.6s ease-out var(--t, 0s) forwards;}
@keyframes rogSmoke{0%{opacity:0; transform:translate(0, 20px) scale(0.8);} 30%{opacity:0.9;} 100%{opacity:0; transform:translate(var(--dx, 0px), -100px) scale(1.5);}}
.card-rogue .fx-glint{inset:-30% -70%; background:linear-gradient(115deg, transparent 47%, rgba(255,255,255,0.95) 50%, transparent 53%);}
.card-rogue:is(:hover, :focus-visible, .is-active) .fx-glint{animation:rogGlint 0.45s ease-in 1.1s forwards;}
@keyframes rogGlint{0%{opacity:0; transform:translateX(-45%);} 15%{opacity:1;} 85%{opacity:1;} 100%{opacity:0; transform:translateX(45%);}}

/* Ezlo, Drow Wizard: violet arcane frame; the flame in his hand flares, a rune circle turns
   around it and sparks spiral off */
.card-wizard{--frame:linear-gradient(135deg, #d7c6ff, #4a2596 25%, #1b0d3d 50%, #7b4ce0 75%, #e0d2ff); --glow:rgba(170,120,255,0.8); --line:#c8b2ff; --tag-ink:#f3eeff; --pos:50% 20%; --focus:80% 22%;}
.card-wizard .fx-tint{inset:0; box-shadow:inset 0 0 45px rgba(140,80,255,0.55);}
.card-wizard:is(:hover, :focus-visible, .is-active) .fx-tint{animation:fadeHold 1s ease forwards;}
@keyframes fadeHold{to{opacity:1;}}
.card-wizard .fx-orb{left:81%; top:20%; width:96px; height:96px; margin:-48px 0 0 -48px; border-radius:50%; background:radial-gradient(circle, rgba(245,230,255,0.95), rgba(175,105,255,0.75) 28%, rgba(120,50,220,0.25) 55%, transparent 70%); mix-blend-mode:screen;}
.card-wizard:is(:hover, :focus-visible, .is-active) .fx-orb{animation:wizOrb 2.6s ease-out forwards;}
@keyframes wizOrb{0%{opacity:0; transform:scale(0.3);} 25%{opacity:1; transform:scale(1.15);} 45%{transform:scale(0.9);} 65%{transform:scale(1.2);} 100%{opacity:0.85; transform:scale(1);}}
.card-wizard .fx-rune{left:81%; top:20%; width:124px; height:124px; margin:-62px 0 0 -62px; border-radius:50%; border:1.5px dashed rgba(215,185,255,0.9); box-shadow:0 0 10px rgba(170,110,255,0.6), inset 0 0 10px rgba(170,110,255,0.4);}
.card-wizard .fx-rune.inner{width:74px; height:74px; margin:-37px 0 0 -37px; border-style:dotted; border-width:2px;}
.card-wizard:is(:hover, :focus-visible, .is-active) .fx-rune{animation:wizRune 2.6s ease-out 0.15s forwards;}
.card-wizard:is(:hover, :focus-visible, .is-active) .fx-rune.inner{animation:wizRuneBack 2.6s ease-out 0.3s forwards;}
@keyframes wizRune{0%{opacity:0; transform:scale(0.4) rotate(0deg);} 30%{opacity:1;} 100%{opacity:0.6; transform:scale(1) rotate(200deg);}}
@keyframes wizRuneBack{0%{opacity:0; transform:scale(0.4) rotate(0deg);} 30%{opacity:1;} 100%{opacity:0.7; transform:scale(1) rotate(-260deg);}}
.card-wizard .fx-p{background:radial-gradient(circle, #fff, #b98cff 55%, transparent 72%); box-shadow:0 0 6px #a66bff;}

/* Bel, Bard: crimson and gold frame; warm candlelight, she tips her ale up for a "cheers",
   the mug glints and music notes drift up */
.card-bard{--frame:linear-gradient(135deg, #f6d27e, #8c1a26 24%, #c23a48 46%, #6e0f19 70%, #f0c060); --glow:rgba(255,170,90,0.7); --line:#f3cf7a; --tag-ink:#fff4dc; --pos:55% 30%; --focus:28% 45%;}
.card-bard:is(:hover, :focus-visible, .is-active) .card-art img{animation:bardCheers 2.4s ease-out forwards;}
@keyframes bardCheers{0%{transform:scale(1) rotate(0deg);} 35%{transform:scale(1.06) rotate(-1.8deg) translateY(-2%);} 55%{transform:scale(1.07) rotate(-0.6deg) translateY(-1%);} 100%{transform:scale(1.07) rotate(-0.8deg) translateY(-1%);}}
.card-bard .fx-warm{inset:0; background:radial-gradient(circle at 30% 72%, rgba(255,170,70,0.4), transparent 60%); mix-blend-mode:screen;}
.card-bard:is(:hover, :focus-visible, .is-active) .fx-warm{animation:candle 2.4s ease forwards;}
@keyframes candle{0%{opacity:0;} 20%{opacity:0.85;} 35%{opacity:0.6;} 50%{opacity:0.95;} 65%{opacity:0.7;} 100%{opacity:0.85;}}
.card-bard .fx-star{--star:#ffe7a3;}
.fx-note{left:var(--x); top:var(--y); font-family:Georgia, serif; font-size:var(--s, 16px); color:#ffd98a; text-shadow:0 0 6px rgba(255,180,80,0.9);}
.card:is(:hover, :focus-visible, .is-active) .fx-note{animation:fxRise var(--d, 2s) ease-out var(--t, 0s) forwards;}
/* Bubbles rise through the ale and wobble out over the foam */
.fx-bubble{left:var(--x); top:var(--y); width:var(--s, 7px); height:var(--s, 7px); border-radius:50%; border:1.5px solid rgba(255,248,225,0.95); box-shadow:0 0 3px rgba(255,235,180,0.7); background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95) 0 18%, rgba(255,230,160,0.15) 45%, transparent 70%);}
.card:is(:hover, :focus-visible, .is-active) .fx-bubble{animation:bubbleUp var(--d, 1.2s) ease-out var(--t, 0s) forwards;}
@keyframes bubbleUp{
  0%{opacity:0; transform:translate(0, 0) scale(0.5);}
  20%{opacity:1;}
  50%{transform:translate(calc(var(--dx, 0px) * -1), calc(var(--dy, -50px) * 0.5)) scale(0.9);}
  100%{opacity:0; transform:translate(var(--dx, 0px), var(--dy, -50px)) scale(1.15);}
}

/* The chosen card comes forward (above) while the others dim back. On touch screens there's
   no hover: the first tap selects a card (.is-active, set by the script at the bottom) and
   shows a "Tap again to open" badge; the second tap opens the character. */
.roster:has(.card:is(:hover, :focus-visible)) .card:not(:hover):not(:focus-visible),
.roster.has-active .card:not(.is-active){opacity:0.55; transform:scale(0.96);}
.card-tap{
  position:absolute; left:50%; bottom:-13px; transform:translateX(-50%); z-index:7; white-space:nowrap;
  padding:4px 12px; border-radius:999px; background:var(--frame); color:var(--tag-ink);
  font-size:0.66rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
  box-shadow:0 3px 10px rgba(0,0,0,0.6); opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.card.is-active .card-tap{opacity:1; animation:tapPulse 1.4s ease-in-out 0.4s infinite;}

:where(.card-plain){--frame:linear-gradient(135deg, var(--sea), var(--panel2) 30%, var(--sea-dim) 55%, var(--panel) 78%, var(--sea)); --glow:rgba(120,200,190,0.45); --line:rgba(255,255,255,0.35); --tag-ink:var(--bg);}

<script>
// The Theme menu (js/themes.js builds it: every theme, including the class themes). The pick is
// this browser's main theme, which any character without its own theme also uses (the DM Screen
// has its own).
// The Theme button opens and closes the menu; a click elsewhere or Escape closes it.
// It stays open after a pick so themes can be compared.
function showThemeMenu(open){
  document.getElementById('themeMenu').hidden = !open;
  document.getElementById('themeToggle').setAttribute('aria-expanded', String(open));
}
document.getElementById('themeToggle').addEventListener('click', ()=>showThemeMenu(document.getElementById('themeMenu').hidden));
// composedPath, not closest(): picking a theme rebuilds the menu, detaching the clicked button
document.addEventListener('click', e=>{ if(!e.composedPath().includes(document.getElementById('themePicker'))) showThemeMenu(false); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') showThemeMenu(false); });
renderThemeMenu();
</script>
<script>
// Cards with a video clip in .card-art play it from the start when chosen and stop it after
// (reduced motion: never play)
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const touchScreen = window.matchMedia('(hover: none)').matches;
function startClip(card){ const v = card.querySelector('.card-video'); if(v && !reduceMotion){ v.currentTime = 0; v.play().catch(()=>{}); } }
function stopClip(card){ const v = card.querySelector('.card-video'); if(v){ v.pause(); v.currentTime = 0; } }
function wireCards(cards){
if(!touchScreen){
  cards.forEach(card=>{
    card.addEventListener('mouseenter', ()=>startClip(card)); card.addEventListener('focus', ()=>startClip(card));
    card.addEventListener('mouseleave', ()=>stopClip(card)); card.addEventListener('blur', ()=>stopClip(card));
  });
} else {
  // Touch screens: first tap brings the card forward and plays its effect; second tap opens it
  const roster = document.querySelector('.roster');
  const select = card=>{
    cards.forEach(c=>{ if(c !== card && c.classList.contains('is-active')){ c.classList.remove('is-active'); stopClip(c); } });
    roster.classList.toggle('has-active', !!card);
    if(card && !card.classList.contains('is-active')){ card.classList.add('is-active'); startClip(card); }
  };
  cards.forEach(card=>{
    const tip = document.createElement('span');
    tip.className = 'card-tap'; tip.textContent = 'Tap again to open';
    card.appendChild(tip);
    card.addEventListener('click', e=>{ if(!card.classList.contains('is-active')){ e.preventDefault(); select(card); } });
  });
  document.addEventListener('click', e=>{ if(!e.target.closest('.card')) select(null); });
  document.getElementById('hubFoot').textContent = 'Tap a character to see them, then tap again to open them.';
}
}
window.wireCards = wireCards;
</script>
<script type="module">
/* ---------- The hub (V6) ----------
   Sign in (Google, or a link by email; test accounts only in test mode), then: My characters (the
   ones this account owns), My campaigns (as DM: open the DM Screen, copy the invite link; as a
   player: the character you brought), Create a campaign, and Join a campaign from an invite link
   (?join=<code>). ?next= sends you back where you came from after signing in.
   Settings: js/config.js; connecting: js/firebase.js. */
const $ = id=>document.getElementById(id);
const esc = v=>String(v ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
const msg = (id, text, err)=>{ const el = $(id); el.textContent = text || ''; el.classList.toggle('err', !!err); };
const randomCode = n=>Array.from(crypto.getRandomValues(new Uint8Array(n)), b=>'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
let f;
try{ f = await tkFirebase(); }
catch(err){ $('hubFoot').textContent = 'Couldn’t reach Turnkeeper. Check your connection and reload.'; throw err; }
const {db, auth, authMod, fb:{ref, get, set, push, update, query, orderByChild, equalTo, serverTimestamp}} = f;
let user = f.user;
const EMAIL_KEY = 'tkEmailForSignIn';
const back = ()=>{ const next = params.get('next'); if(next && /^(turnkeeper|dm)\.html(\?[^#]*)?$/.test(next)) location.href = next; else { const keep = params.get('join'); location.href = 'index.html' + (keep ? '?join=' + encodeURIComponent(keep) : ''); } };

// Finishing a sign-in from an email link
if(!user && authMod.isSignInWithEmailLink(auth, location.href)){
  let email = null; try{ email = localStorage.getItem(EMAIL_KEY); }catch(e){}
  if(!email) email = prompt('To finish signing in, type the email address the link was sent to:');
  if(email){
    try{ await authMod.signInWithEmailLink(auth, email.trim(), location.href); try{ localStorage.removeItem(EMAIL_KEY); }catch(e){} back(); }
    catch(err){ msg('authMsg', 'That sign-in link didn’t work (it may have expired). Ask for a new one.', true); }
  }
}

if(!user){
  $('hubAuth').hidden = false;
  if(TEST_MODE){ $('signTestRow').hidden = false; $('hubSub').innerHTML = 'your characters and campaigns <span class="test-tag">test mode</span>'; }
  $('signGoogle').onclick = async ()=>{
    msg('authMsg', '');
    try{ await authMod.signInWithPopup(auth, new authMod.GoogleAuthProvider()); back(); }
    catch(err){
      if(err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') authMod.signInWithRedirect(auth, new authMod.GoogleAuthProvider());
      else if(err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') msg('authMsg', 'Google sign-in didn’t work: ' + err.message, true);
    }
  };
  $('signEmailGo').onclick = async ()=>{
    const email = $('signEmail').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg('authMsg', 'Type your email address first.', true); return; }
    try{
      await authMod.sendSignInLinkToEmail(auth, email, {url:location.href, handleCodeInApp:true});
      try{ localStorage.setItem(EMAIL_KEY, email); }catch(e){}
      msg('authMsg', `A sign-in link is on its way to ${email}. Open it on this device. (Check spam if it doesn’t arrive.)`);
    }catch(err){ msg('authMsg', 'Couldn’t send the link: ' + err.message, true); }
  };
  $('signTest').onclick = async ()=>{
    if(!TEST_MODE) return;
    const name = (prompt('A name for this test account (e.g. Test DM, Test Player 1):') || '').trim().slice(0, 60);
    if(!name) return;
    // Each tab is its own test account (so one tab can be the DM and another a player)
    try{ await authMod.setPersistence(auth, authMod.browserSessionPersistence); const cred = await authMod.signInAnonymously(auth); await set(ref(db, `${USERS}/${cred.user.uid}`), {name}); back(); }
    catch(err){ msg('authMsg', 'Test sign-in didn’t work: ' + err.message, true); }
  };
} else {
  // Signed in: make sure the account has a record (name and email), then show everything
  const userRef = ref(db, `${USERS}/${user.uid}`);
  let me = (await get(userRef)).val() || {};
  if(!me.name){
    const name = (user.displayName || (user.email || '').split('@')[0] || 'Player').slice(0, 60);
    await update(userRef, {name, ...(user.email ? {email:user.email.slice(0, 120)} : {})});
    me = {...me, name, email:user.email};
  }
  if(params.get('next')){ back(); }
  $('hubUser').hidden = false;
  $('hubUser').innerHTML = `Signed in as <b>${esc(me.name)}</b>${user.email ? ` (${esc(user.email)})` : user.isAnonymous ? ' (test account)' : ''}${TEST_MODE ? ' <span class="test-tag">test mode</span>' : ''} · <button type="button" id="signOut">Sign out</button>`;
  $('signOut').onclick = async ()=>{ await authMod.signOut(auth); location.href = 'index.html'; };
  $('hubSub').textContent = `welcome, ${me.name}`;

  // My characters (characters/<id> where owner is this account)
  const mineSnap = await get(query(ref(db, CHARS), orderByChild('owner'), equalTo(user.uid))).catch(err=>{ console.warn('My characters:', err); return null; });
  const allMine = Object.entries((mineSnap && mineSnap.val()) || {}).map(([id, rec])=>({id, rec}));
  const mine = allMine.filter(x=>!x.rec.archived), archivedChars = allMine.filter(x=>x.rec.archived);
  const campNames = {};
  const myCamps = me.campaigns && typeof me.campaigns === 'object' ? me.campaigns : {};
  await Promise.all(Object.keys(myCamps).map(async k=>{ const m = (await get(ref(db, `${CAMP(k)}/meta`)).catch(()=>null))?.val(); if(m) campNames[k] = m; }));
  $('hubChars').hidden = false;
  const roster = $('myRoster'), tpl = $('knownCards').content;
  // Sparks that rise on hover (the hand-made cards have their own effects): [x, y, size, drift x, rise, length, delay]
  const SPARKS = '<div class="card-fx">' + [[18,78,5,10,-150,2.2,0.1], [34,88,4,-8,-170,2.4,0.4], [52,82,6,6,-160,2,0.2], [68,90,4,-12,-180,2.6,0.6],
    [80,76,5,8,-140,2.1,0.3], [26,70,3,-6,-120,1.9,0.8], [60,72,4,10,-130,2.3,0.9], [44,92,5,-4,-190,2.5,0.5]]
    .map(([x, y, sz, dx, dy, d, t])=>`<span class="fx-p" style="--x:${x}%;--y:${y}%;--s:${sz}px;--dx:${dx}px;--dy:${dy}px;--d:${d}s;--t:${t}s"></span>`).join('') + '</div>';
  mine.sort((a, b)=>String(a.rec.core && a.rec.core.name || '').localeCompare(String(b.rec.core && b.rec.core.name || ''))).forEach(({id, rec})=>{
    const core = rec.core || {}, name = String(core.name || 'Unnamed').slice(0, 40);
    const known = [...tpl.querySelectorAll('a.card')].find(a=>a.getAttribute('href').includes(id));
    let card;
    if(known){ card = known.cloneNode(true); const n = card.querySelector('.card-name'); if(n) n.textContent = name; }
    else {
      const cls = iconClassOf(core.cls), fit = clampFit(core.portraitFit);
      card = document.createElement('a'); card.className = 'card card-plain' + (cls ? ' card-' + cls : ''); card.href = 'turnkeeper.html?char=' + id; card.target = '_blank'; card.rel = 'noopener';
      const pic = typeof core.portrait === 'string' && (v=>/^data:image\/(webp|jpeg|png);base64,[A-Za-z0-9+/=]+$/.test(v) || /^https:\/\/[^\s"'<>]+$/.test(v))(core.portrait) ? core.portrait : '';
      if(pic) card.style.setProperty('--pos', `${fit.x}% ${fit.y}%`);
      card.innerHTML = `<div class="card-art">${pic ? `<img src="${esc(pic)}" alt="">` : `<div class="card-coin">${charIconHtml(null, '', '', {name, cls:core.cls})}</div>`}${SPARKS}<div class="card-plate"><div class="card-name">${esc(name)}</div><div class="card-sub">${esc([core.race, core.cls].filter(Boolean).join(' ').slice(0, 50))}</div></div></div>`;
    }
    card.insertAdjacentHTML('beforeend', `<button type="button" class="card-archive" data-archive="${esc(id)}" title="Archive ${esc(name)}" aria-label="Archive ${esc(name)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-.2l-.8 10.1A2 2 0 0 1 17 21H7a2 2 0 0 1-2-1.9L4.2 9H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm2.2 5 .8 10h10l.8-10H6.2zM5 6v1h14V6H5zm4 5h6v2H9v-2z"/></svg></button>`);
    roster.appendChild(card);
  });
  /* Archive: put a character away. It leaves its campaign (and stops playing there), and moves to
     Archived Characters, where it can be made active again or deleted for good. */
  const leaveCampaign = (patch, x)=>{
    const k = x.rec.campaign; if(!k) return;
    patch[`${CHARS}/${x.id}/campaign`] = null;
    if(myCamps[k] === 'player'){ patch[`${CAMP(k)}/members/${user.uid}`] = null; patch[`${USERS}/${user.uid}/campaigns/${k}`] = null; }
    if(myCamps[k] === 'dm') patch[`${CAMP(k)}/members/copy-${x.id}`] = null;   // a test copy in your own campaign's party
  };
  roster.addEventListener('click', async e=>{
    const b = e.target.closest('[data-archive]'); if(!b) return;
    e.preventDefault(); e.stopPropagation();
    const x = mine.find(m=>m.id === b.dataset.archive); if(!x) return;
    const name = (x.rec.core && x.rec.core.name) || 'this character', camp = x.rec.campaign && campNames[x.rec.campaign];
    if(!confirm(`Archive ${name}?${camp ? ` ${name} leaves ${camp.name}.` : ''} You can make ${name} active again from Archived Characters.`)) return;
    const patch = {[`${CHARS}/${x.id}/archived`]:true}; leaveCampaign(patch, x);
    try{ await update(ref(db), patch); location.reload(); }
    catch(err){ msg('archMsg', 'Couldn’t archive: ' + err.message, true); }
  }, true);
  // Archived Characters: make active again, or delete for good (typing the name to be sure)
  if(archivedChars.length){
    const box = $('hubArchived'); box.hidden = false;
    $('archCount').textContent = archivedChars.length;
    $('archList').innerHTML = archivedChars.map(x=>{ const c = x.rec.core || {};
      return `<div class="hub-camp"><b>${esc(c.name || 'Unnamed')}</b> <span class="hub-note">· ${esc([c.level ? 'Level ' + c.level : '', c.race, c.cls].filter(Boolean).join(' '))}</span>`
        + `<div class="hub-row"><button type="button" class="hub-btn ghost" data-unarchive="${esc(x.id)}">Make active</button><button type="button" class="hub-btn ghost danger" data-delete="${esc(x.id)}">Delete forever</button></div></div>`; }).join('');
    $('archList').addEventListener('click', async e=>{
      const id = e.target.dataset.unarchive || e.target.dataset.delete; if(!id) return;
      const x = archivedChars.find(m=>m.id === id), name = String((x.rec.core && x.rec.core.name) || 'Unnamed');
      try{
        if(e.target.dataset.unarchive){ await update(ref(db), {[`${CHARS}/${id}/archived`]:null}); location.reload(); return; }
        const typed = prompt(`Delete ${name} forever? This can’t be undone: everything about ${name} is gone.\n\nType the name to delete: ${name}`);
        if(typed === null) return;
        if(typed.trim().toLowerCase() !== name.trim().toLowerCase()){ msg('archMsg', 'The name didn’t match, so nothing was deleted.', true); return; }
        await set(ref(db, `${CHARS}/${id}`), null); location.reload();
      }catch(err){ msg('archMsg', 'Couldn’t do that: ' + err.message, true); }
    });
  }
  window.wireCards([...roster.querySelectorAll('.card')]);
  $('charsNote').textContent = mine.length ? (touchScreenHint() ? '' : 'Click a character to open them.') : 'No characters yet. Create one to get started.';

  // My campaigns
  $('hubCamps').hidden = false;
  const renderCamps = ()=>{
    const keys = Object.keys(myCamps).filter(k=>campNames[k]);
    $('campList').innerHTML = keys.length ? keys.map(k=>{
      const m = campNames[k], dm = m.dm === user.uid;
      const ch = mine.find(x=>x.rec.campaign === k);
      return `<div class="hub-camp"><b>${esc(m.name)}</b> <span class="hub-note">· ${dm ? 'you’re the DM' : ch ? 'playing ' + esc((ch.rec.core && ch.rec.core.name) || 'a character') : 'player'}</span>`
        // A player: switch which of their characters plays here
        + (!dm && mine.some(x=>x.rec.campaign !== k) ? `<div class="hub-row"><select data-swap-pick="${esc(k)}" aria-label="Character to bring">${mine.filter(x=>x.rec.campaign !== k).map(x=>`<option value="${esc(x.id)}">${esc((x.rec.core && x.rec.core.name) || 'Unnamed')}</option>`).join('')}</select><button type="button" class="hub-btn ghost" data-swap="${esc(k)}"${ch ? ` data-old="${esc(ch.id)}"` : ''}>Bring this one instead</button></div>` : '')
        + (dm ? `<div class="hub-row"><a class="hub-btn" href="dm.html?c=${esc(k)}" target="_blank" rel="noopener">Open the DM Screen</a><button type="button" class="hub-btn ghost" data-invite="${esc(k)}">Copy invite link</button><button type="button" class="hub-btn ghost" data-newinvite="${esc(k)}" title="Makes a new link; the old one stops working">New invite link</button></div>` : '')
        + '</div>';
    }).join('') : '<p class="hub-note">You’re not in a campaign yet. Create one (you’ll be its DM), or ask your DM for an invite link.</p>';
  };
  renderCamps();
  window.swapCharacter = async (key, id, oldId, msgId)=>{
    try{ await swapCharacterIn(db, {ref, update}, user, key, id, oldId); location.href = 'index.html'; }
    catch(err){ msg(msgId, 'Couldn’t switch characters: ' + err.message, true); }
  };
  const inviteUrl = code=>location.origin + location.pathname.replace(/[^/]*$/, '') + 'index.html?join=' + code + (TEST_MODE && !['localhost', '127.0.0.1'].includes(location.hostname) ? '&test=1' : '');
  $('campList').addEventListener('click', async e=>{
    if(e.target.dataset.swap){ const k = e.target.dataset.swap; window.swapCharacter(k, document.querySelector(`[data-swap-pick="${k}"]`).value, e.target.dataset.old || null, 'campMsg'); return; }
    const k = e.target.dataset.invite || e.target.dataset.newinvite; if(!k) return;
    const m = campNames[k]; let code = m.invite;
    if(e.target.dataset.newinvite){
      code = randomCode(10);
      try{ await update(ref(db), {[`${DBROOT}invites/${m.invite}`]:null, [`${DBROOT}invites/${code}`]:{key:k, name:m.name}, [`${CAMP(k)}/meta/invite`]:code}); m.invite = code; }
      catch(err){ msg('campMsg', 'Couldn’t make a new link: ' + err.message, true); return; }
    }
    try{ await navigator.clipboard.writeText(inviteUrl(code)); msg('campMsg', `Invite link for ${m.name} copied${e.target.dataset.newinvite ? ' (the old link no longer works)' : ''}. Send it to your players.`); }
    catch(err){ prompt('Copy this invite link:', inviteUrl(code)); }
  });
  // Join with an invite link or code pasted in: the same as opening the link
  const joinFromBox = ()=>{
    const v = $('joinCode').value.trim(), m = v.match(/[?&]join=([A-Za-z0-9]+)/), code = (m ? m[1] : v).toLowerCase();
    if(!/^[a-z0-9]{8,40}$/.test(code)){ msg('campMsg', 'That doesn’t look like an invite link or code. Ask your DM to copy it again.', true); return; }
    location.href = 'index.html?join=' + code + (params.get('test') ? '&test=1' : '');
  };
  $('joinCodeGo').onclick = joinFromBox;
  $('joinCode').addEventListener('keydown', e=>{ if(e.key === 'Enter') joinFromBox(); });
  // Create a campaign: you're its DM; it gets an invite code
  $('newCampGo').onclick = async ()=>{
    const name = $('newCampName').value.trim().slice(0, 80); if(!name){ msg('campMsg', 'Give the campaign a name first.', true); return; }
    const key = (name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30) || 'campaign') + '-' + randomCode(4);
    const code = randomCode(10);
    try{
      await update(ref(db), {
        [`${CAMP(key)}/meta`]:{name, dm:user.uid, invite:code, created:serverTimestamp()},
        [`${CAMP(key)}/members/${user.uid}`]:{role:'dm', joined:serverTimestamp()},
        [`${DBROOT}invites/${code}`]:{key, name},
        [`${USERS}/${user.uid}/campaigns/${key}`]:'dm',
      });
      myCamps[key] = 'dm'; campNames[key] = {name, dm:user.uid, invite:code};
      $('newCampName').value = ''; renderCamps(); msg('campMsg', `${name} is ready. Copy its invite link for your players.`);
    }catch(err){ msg('campMsg', 'Couldn’t create the campaign: ' + err.message, true); }
  };

  /* Admin (test mode only): copy a real character into the sandbox to try things out. The admin mark
     (admins/<account>) is set by hand with the Firebase CLI; the real character is only read, never
     written. Real characters are at characters/<id> (V6), or before the switch-over at the old spot
     (campaigns/waterdeep/characters/<id>) for the four in PORTRAITS. */
  if(TEST_MODE){
    const admin = (await get(ref(db, `admins/${user.uid}`)).catch(()=>null))?.val() === true;
    if(admin){
      let real = Object.entries((await get(ref(db, 'characters')).catch(()=>null))?.val() || {}).map(([id, rec])=>({id, rec}));
      if(!real.length) real = (await Promise.all(Object.keys(PORTRAITS).map(async id=>({id, rec:(await get(ref(db, `campaigns/waterdeep/characters/${id}`)).catch(()=>null))?.val()})))).filter(x=>x.rec && x.rec.core);
      const box = $('hubAdmin'); box.hidden = false;
      const myDm = Object.keys(myCamps).filter(k=>myCamps[k] === 'dm' && campNames[k]);
      box.innerHTML = `<h2>Test Copies</h2><p class="hub-note">Admin: copy a real character into the sandbox to try things out. The real one is only read, never changed.</p>`
        + (myDm.length ? `<div class="hub-row"><label class="hub-note">Add each copy to the party of <select id="copyTo"><option value="">no campaign</option>${myDm.map(k=>`<option value="${esc(k)}">${esc(campNames[k].name)}</option>`).join('')}</select></label></div>`
          : '<p class="hub-note">To run them in a fight, create a campaign below first (you’ll be its DM); copies can then join its party.</p>')
        + (real.length ? real.map(x=>`<div class="hub-row"><b>${esc((x.rec.core && x.rec.core.name) || x.id)}</b><button type="button" class="hub-btn ghost" data-copy="${esc(x.id)}">Copy into the sandbox</button></div>`).join('') : '<p class="hub-note">No real characters found.</p>')
        + '<div class="hub-msg" id="adminMsg"></div>';
      box.addEventListener('click', async e=>{
        const id = e.target.dataset.copy; if(!id) return;
        const x = real.find(r=>r.id === id); if(!x) return;
        const core = {...x.rec.core, name:String((x.rec.core.name || 'Character') + ' (test copy)').slice(0, 40)};
        // The kv keys name the character as "@", so they work for the copy as they are
        try{
          const r = push(ref(db, CHARS));
          const to = $('copyTo') ? $('copyTo').value : '';
          await set(r, {owner:user.uid, core, kv:x.rec.kv || {}, t:serverTimestamp(), ...(to ? {campaign:to} : {})});
          // In your test campaign's party (you're its DM, so you can add it; the DM Screen lists it)
          if(to) await set(ref(db, `${CAMP(to)}/members/copy-${r.key}`), {role:'player', char:r.key, joined:serverTimestamp()});
          msg('adminMsg', `${core.name} is ready${to ? ' and in ' + campNames[to].name + '’s party' : ''}.`);
          window.open('turnkeeper.html?char=' + encodeURIComponent(r.key) + (params.get('test') ? '&test=1' : ''), '_blank', 'noopener');
        }catch(err){ msg('adminMsg', 'Couldn’t copy it: ' + err.message, true); }
      });
    }
  }

  // Joining from an invite link: pick one of your characters to bring
  const join = params.get('join');
  if(join && /^[a-z0-9]{8,40}$/.test(join)){
    const inv = (await get(ref(db, `${DBROOT}invites/${join}`)).catch(()=>null))?.val();
    const box = $('hubJoin'); box.hidden = false;
    if(!inv || !inv.key) box.innerHTML = '<h2>Join a Campaign</h2><p class="hub-note">That invite link doesn’t work any more. Ask your DM for a new one.</p>';
    else if(myCamps[inv.key] === 'dm') box.innerHTML = `<h2>Join a Campaign</h2><p class="hub-note">You’re the DM of <b>${esc(inv.name)}</b>.</p>`;
    else if(myCamps[inv.key]){
      // A player there already: they can bring a different character of theirs instead (one per campaign)
      const now = mine.find(x=>x.rec.campaign === inv.key), others = mine.filter(x=>x.rec.campaign !== inv.key);
      box.innerHTML = `<h2>${esc(inv.name)}</h2><p class="hub-note">You’re already in it${now ? ', playing <b>' + esc((now.rec.core && now.rec.core.name) || 'a character') + '</b>' : ''}.</p>`
        + (others.length ? `<p class="hub-note">Bring a different character instead?</p><div class="hub-row"><select id="swapChar">${others.map(x=>`<option value="${esc(x.id)}"${x.id === params.get('pick') ? ' selected' : ''}>${esc((x.rec.core && x.rec.core.name) || 'Unnamed')}</option>`).join('')}</select><button type="button" class="hub-btn" id="swapGo">Bring this one</button></div><div class="hub-msg" id="joinMsg"></div>` : '');
      const go = $('swapGo');
      if(go) go.onclick = ()=>swapCharacter(inv.key, $('swapChar').value, now && now.id, 'joinMsg');
    }
    else {
      const free = mine;
      box.innerHTML = `<h2>Join ${esc(inv.name)}</h2>` + (free.length
        ? `<p class="hub-note">Which character are you bringing? (A character plays in one campaign at a time; bringing one here takes it out of any other.)</p><div class="hub-row"><select id="joinChar">${free.map(x=>`<option value="${esc(x.id)}"${x.id === params.get('pick') ? ' selected' : ''}>${esc((x.rec.core && x.rec.core.name) || 'Unnamed')}${x.rec.campaign ? ' (now in ' + esc((campNames[x.rec.campaign] || {}).name || 'another campaign') + ')' : ''}</option>`).join('')}</select><button type="button" class="hub-btn" id="joinGo">Join</button></div><div class="hub-msg" id="joinMsg"></div><p class="hub-note">Or <a href="create.html?join=${esc(join)}">make a new character</a> for it.</p>`
        : `<p class="hub-note">You need a character to bring.</p><div class="hub-row"><a class="hub-btn" href="create.html?join=${esc(join)}">Make a character for ${esc(inv.name)}</a></div>`);
      const go = $('joinGo');
      if(go) go.onclick = async ()=>{
        const id = $('joinChar').value, ch = free.find(x=>x.id === id), was = ch && ch.rec.campaign;
        const patch = {
          [`${CAMP(inv.key)}/members/${user.uid}`]:{role:'player', char:id, invite:join, joined:serverTimestamp()},
          [`${CHARS}/${id}/campaign`]:inv.key,
          [`${USERS}/${user.uid}/campaigns/${inv.key}`]:'player',
        };
        if(was && was !== inv.key){ patch[`${CAMP(was)}/members/${user.uid}`] = null; patch[`${USERS}/${user.uid}/campaigns/${was}`] = null; }
        try{ await update(ref(db), patch); location.href = 'index.html'; }
        catch(err){ msg('joinMsg', 'Couldn’t join: ' + err.message, true); }
      };
    }
  }
}
async function swapCharacterIn(db, fb, user, key, id, oldId){
  const {ref, update} = fb;
  const patch = {[`${CAMP(key)}/members/${user.uid}/char`]:id, [`${CHARS}/${id}/campaign`]:key};
  if(oldId && oldId !== id) patch[`${CHARS}/${oldId}/campaign`] = null;
  await update(ref(db), patch);
}
function touchScreenHint(){ return window.matchMedia('(hover: none)').matches; }
</script>
