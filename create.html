<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Character · Turnkeeper</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/char-icons.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap">

<style>
:root{
  --bg:#0c1b26; --panel:#13293d; --panel2:#1b3750; --border:#2b4d68;
  --ink:#e4edf2; --ink-dim:#8fa6b8; --sea:#4fb8a6; --sea-dim:#2f7d70;
  --orange:#d97b3f; --orange-bright:#ea9257;
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
/* Color themes: copied from index.html (keep in step with it and turnkeeper.html) */
html[data-theme="midnight"]{--bg:#0f0d1a; --panel:#1a1730; --panel2:#252142; --border:#3b3563; --ink:#ece8f7; --ink-dim:#a49dc4; --sea:#b7a0f2; --sea-dim:#9a84dc; --orange:#c9962f;}
html[data-theme="grove"]{--bg:#0e1712; --panel:#16241c; --panel2:#1f3327; --border:#30503c; --ink:#e8f0e3; --ink-dim:#9fb5a1; --sea:#9ccf6f; --sea-dim:#557f3d; --orange:#c47a35;}
html[data-theme="ember"]{--bg:#151011; --panel:#221a1b; --panel2:#2f2425; --border:#4b3638; --ink:#f3eae7; --ink-dim:#b9a4a1; --sea:#d9a955; --sea-dim:#8a6630; --orange:#b8433a;}
html[data-theme="daylight"]{--bg:#eef2f5; --panel:#ffffff; --panel2:#e7edf2; --border:#c3d0da; --ink:#1b2a36; --ink-dim:#5a6e7e; --sea:#1d7a6e; --sea-dim:#4aa597; --orange:#dd7d3e;}
html[data-theme="tome"]{
  --bg:#d8c39a; --panel:#f2e7cc; --panel2:#e7d7b2; --border:#b39b6d; --ink:#2b1c11; --ink-dim:#6b5237; --sea:#7d1a16; --sea-dim:#8a5a2b; --orange:#8e2a1e;
  --font-display: 'Cinzel', 'Trajan Pro', 'Book Antiqua', Georgia, serif;
  --font-body: 'EB Garamond', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
}
html[data-theme="tome"] body{background-image:radial-gradient(ellipse at 50% 0%, rgba(255,247,222,0.6), transparent 65%), radial-gradient(ellipse at 50% 100%, rgba(110,70,25,0.22), transparent 70%); background-attachment:fixed;}
html[data-theme="tome"] h1{font-variant:small-caps; letter-spacing:0.08em; font-weight:600;}
html[data-theme="keep"]{
  --bg:#1e140c; --panel:#3a2515; --panel2:#46301c; --border:#56565c; --ink:#f0e4ca; --ink-dim:#bda98a; --sea:#d9ad56; --sea-dim:#8f6a2a; --orange:#a9572a;
  --font-display: 'MedievalSharp', 'Cinzel', 'Book Antiqua', Georgia, serif;
}
html[data-theme="keep"] body{background-image:radial-gradient(ellipse at 50% 35%, transparent 35%, rgba(0,0,0,0.6) 100%), repeating-linear-gradient(90deg, rgba(0,0,0,0.45) 0 2px, rgba(255,210,150,0.04) 2px 3px, transparent 3px 170px), repeating-linear-gradient(0deg, rgba(255,215,160,0.03) 0 1px, transparent 1px 6px), linear-gradient(90deg, #21150c, #2b1b0f 50%, #21150c); background-attachment:fixed;}
html[data-theme="keep"] h1{text-shadow:0 1px 0 rgba(0,0,0,0.85), 0 0 8px rgba(217,173,86,0.18);}
html[data-theme="inferno"]{
  --bg:#0a0505; --panel:#170c0b; --panel2:#231110; --border:#4d1812; --ink:#f0dfd3; --ink-dim:#ad8d82; --sea:#ff6a2a; --sea-dim:#a8360f; --orange:#8f1510;
  --font-display: 'Pirata One', 'UnifrakturCook', 'Book Antiqua', Georgia, serif;
}
html[data-theme="inferno"] body{background-image:linear-gradient(to top, rgba(255,72,0,0.28), rgba(160,20,0,0.1) 30%, transparent 55%), radial-gradient(ellipse at 20% 110%, rgba(255,110,20,0.35), transparent 45%), radial-gradient(ellipse at 80% 115%, rgba(255,60,0,0.3), transparent 45%), radial-gradient(ellipse at 50% 0%, rgba(90,0,0,0.35), transparent 60%); background-attachment:fixed;}
html[data-theme="inferno"] body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:0.75;
  background-image:radial-gradient(circle at 20px 40px, rgba(255,170,60,0.9) 0 1.2px, transparent 2.5px), radial-gradient(circle at 150px 190px, rgba(255,110,30,0.8) 0 1.5px, transparent 3px), radial-gradient(circle at 240px 90px, rgba(255,200,90,0.7) 0 1px, transparent 2px), radial-gradient(circle at 90px 250px, rgba(255,90,20,0.8) 0 1.3px, transparent 2.6px);
  background-size:300px 300px, 300px 300px, 300px 300px, 420px 420px;
  animation:embersRise 18s linear infinite;
}
@keyframes embersRise{from{background-position:0 0, 0 0, 0 0, 0 0;} to{background-position:30px -300px, -20px -300px, 10px -300px, -40px -420px;}}
@media (prefers-reduced-motion: reduce){ html[data-theme="inferno"] body::before{animation:none;} }
html[data-theme="inferno"] h1{text-shadow:0 0 6px rgba(255,90,20,0.55), 0 0 18px rgba(200,20,0,0.35), 0 1px 0 #000; font-size:3rem;}
/* ---------- The character creator ---------- */
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--font-body); padding:36px 16px 64px; display:flex; flex-direction:column; align-items:center;}
.wrap{width:100%; max-width:860px;}
header{text-align:center; margin-bottom:22px;}
h1{font-family:var(--font-display); font-weight:normal; font-size:2.2rem; color:var(--sea); margin:0;}
.sub{font-family:var(--font-display); font-style:italic; color:var(--ink-dim); margin-top:6px;}
.sub a{color:var(--sea);}
h2{font-family:var(--font-display); font-weight:normal; color:var(--sea); font-size:1.5rem; margin:0 0 14px;}
h3{font-family:var(--font-display); font-weight:normal; color:var(--ink); font-size:1.1rem; margin:20px 0 8px;}
.steps{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:18px;}
.step{display:flex; align-items:center; gap:6px; background:var(--panel); color:var(--ink-dim); border:1px solid var(--border); border-radius:999px; padding:5px 12px 5px 6px; font:inherit; font-size:0.85rem; cursor:pointer;}
.step span{display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--panel2); font-size:0.72rem;}
.step.done span{background:var(--sea-dim); color:var(--bg);}
.step.on{border-color:var(--sea); color:var(--ink);}
.step.on span{background:var(--sea); color:var(--bg);}
.panel{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px 22px;}
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px;}
.pick{text-align:left; background:var(--panel2); color:var(--ink); border:1px solid var(--border); border-radius:8px; padding:9px 11px; font:inherit; cursor:pointer;}
.pick b{display:block; font-family:var(--font-display); font-weight:normal; font-size:1.02rem;}
.pick small{color:var(--ink-dim); font-size:0.75rem;}
.pick.on{border-color:var(--sea); box-shadow:0 0 0 1px var(--sea) inset;}
.box{background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-top:14px;}
.box h3{margin-top:0;}
.box.warn{border-color:var(--orange);}
.box.warn ul{margin:6px 0 0; padding-left:20px;}
.note{color:var(--ink-dim); font-size:0.88rem; margin:6px 0;}
.traits{margin:8px 0 0; padding-left:18px; font-size:0.88rem;}
.traits li{margin:4px 0;}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0;}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:5px 9px; font-size:0.9rem; cursor:pointer;}
.chip small{color:var(--ink-dim); font-size:0.68rem;}
.chip.fixed{opacity:0.7;}
.chip:has(input:checked){border-color:var(--sea);}
.chip:has(input:disabled:not(:checked)){opacity:0.45; cursor:default;}
.chip.spell{font-size:0.86rem;}
.choice{margin:8px 0; padding:8px 0; border-top:1px solid var(--border);}
.choice .or{color:var(--ink-dim); font-size:0.8rem; margin:0 6px;}
.choice > div{margin-top:6px;}
select, input, textarea{background:var(--bg); color:var(--ink); border:1px solid var(--border); border-radius:6px; padding:7px 9px; font:inherit; max-width:100%;}
.field{display:flex; flex-direction:column; gap:4px; margin:10px 0;}
.field span{font-size:0.85rem; color:var(--ink-dim);}
.field textarea, .field input{width:100%;}
table.abil{border-collapse:collapse; margin:12px 0;}
table.abil th, table.abil td{padding:6px 10px; text-align:center; border-bottom:1px solid var(--border);}
table.abil th:first-child{text-align:left; font-weight:normal;}
.mini{width:28px; height:28px; border-radius:6px; border:1px solid var(--sea-dim); background:transparent; color:var(--sea); font:inherit; cursor:pointer;}
.mini:disabled{opacity:0.35; cursor:default;}
.rolls{display:flex; flex-wrap:wrap; gap:10px; margin:10px 0;}
.rollset{display:inline-flex; align-items:center; gap:4px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:6px 10px;}
.rollset i{font-style:normal; display:inline-grid; place-items:center; width:22px; height:22px; border-radius:4px; background:var(--bg); font-size:0.8rem;}
.rollset i.drop{opacity:0.35; text-decoration:line-through;}
.rollset b{margin-left:6px; color:var(--sea); font-size:1.1rem;}
.scores{display:flex; flex-wrap:wrap; gap:8px;}
.scores span{display:flex; flex-direction:column; align-items:center; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 10px; min-width:56px; font-size:0.8rem; color:var(--ink-dim);}
.scores b{font-size:1.2rem; color:var(--ink);}
.btn{background:var(--sea); color:var(--bg); border:none; border-radius:6px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer;}
.btn.ghost{background:transparent; color:var(--sea); border:1px solid var(--sea-dim);}
.btn:disabled{opacity:0.5; cursor:default;}
.nav{display:flex; gap:10px; align-items:center; margin-top:16px;}
.nav .todo{flex:1; color:var(--orange-bright); font-size:0.85rem;}
.msg{min-height:1.2em; font-size:0.9rem; color:var(--sea);}
.msg.err{color:var(--orange-bright);}
.foot{margin-top:18px; text-align:center;}
.foot button{background:none; border:none; color:var(--ink-dim); text-decoration:underline; cursor:pointer; font:inherit; font-size:0.8rem;}
/* Three columns: the steps (left), the step itself (centered on the page), the character card (right).
   The side columns are the same width so the middle stays centered. */
.wrap{max-width:1280px;}
.layout{display:grid; grid-template-columns:240px minmax(0, 760px) 240px; justify-content:center; gap:20px; align-items:start;}
.layout > .steps{flex-direction:column; flex-wrap:nowrap; align-items:stretch; justify-content:flex-start; position:sticky; top:16px; margin:0;}
.layout > .steps .step{border-radius:8px; padding:8px 12px 8px 8px; font-size:0.92rem;}
.summary{position:sticky; top:16px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; font-size:0.85rem;}
.sum-head{display:flex; gap:10px; align-items:center;}
.sum-head b{display:block; font-family:var(--font-display); font-weight:normal; font-size:1.2rem; color:var(--sea);}
.sum-head small{color:var(--ink-dim);}
.sum-portrait{width:56px; flex:none;}
.sum-scores{display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; margin:10px 0 6px;}
.sum-scores span{display:flex; flex-direction:column; align-items:center; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:3px 0;}
.sum-scores small{font-size:0.62rem; color:var(--ink-dim);}
.sum-scores b{font-size:1rem;}
.sum-scores i{font-style:normal; font-size:0.7rem; color:var(--ink-dim);}
.sum-line{margin:6px 0; color:var(--ink);}
.sum-line span{color:var(--ink-dim); margin-right:4px;}
.items{list-style:none; margin:6px 0; padding:0; font-size:0.86rem;}
.items li{margin:4px 0;}
.items li span{color:var(--ink-dim);}
.tipname{text-decoration:underline dotted; text-underline-offset:3px; cursor:help;}
.chip.spell .sname{cursor:help; text-decoration:underline dotted; text-underline-offset:3px;}
.slotpick, .toolpick{margin:6px 0;}
.levelpick{margin:14px 0 4px;}
.traits .lv{display:inline-block; min-width:34px; color:var(--ink-dim); font-size:0.72rem;}
.rollset small{color:var(--ink-dim); font-size:0.7rem; margin-right:4px;}
h4{font-family:var(--font-display); font-weight:normal; color:var(--ink-dim); font-size:0.9rem; margin:10px 0 4px;}
.slotpick .note{display:block;}
.grid3{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:0 12px;}
.portrait-row{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;}
.portrait{width:120px; height:120px; border-radius:50%; overflow:hidden; border:2px solid var(--sea-dim); background:var(--bg); display:grid; place-items:center; flex:none;}
.portrait img{width:100%; height:100%; object-fit:cover;}
.portrait span{color:var(--ink-dim); font-size:0.78rem; text-align:center; padding:8px;}
.portrait-opts{flex:1 1 240px; min-width:0;}
.upload{display:inline-block;}
.linkbtn{background:none; border:none; color:var(--sea); text-decoration:underline; cursor:pointer; font:inherit; padding:0;}
#tooltip{position:fixed; z-index:999; max-width:min(300px, calc(100vw - 28px)); background:var(--panel2); border:1px solid var(--sea-dim); color:var(--ink); font-size:0.8rem; padding:10px 12px; border-radius:6px; box-shadow:0 6px 20px rgba(0,0,0,.5); display:none; pointer-events:none;}
#tooltip b{color:var(--sea); display:block; margin-bottom:4px; font-family:var(--font-display); font-size:0.9rem;}
#tooltip .meta{color:var(--ink-dim); line-height:1.5;}
#tooltip a{color:var(--sea); pointer-events:auto;}
#tooltip.tip-held{pointer-events:auto; border-color:var(--sea);}
#tooltip .tip-link{margin-top:8px; display:flex; flex-direction:column; gap:2px;}
#tooltip .tip-hint{color:var(--ink-dim); font-size:0.72rem; font-style:italic;}
#tooltip.tip-held .tip-hint{display:none;}
/* Narrower: the steps go back across the top, and the card sits above the step */
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0, 760px);}
  .layout > .steps{position:static; flex-direction:row; flex-wrap:wrap; justify-content:center;}
  .layout > .steps .step{border-radius:999px; padding:5px 12px 5px 6px; font-size:0.85rem;}
  .summary{position:static; order:-1;}
  .layout > .steps{order:-2;}
}
@media (max-width:560px){ .grid3{grid-template-columns:repeat(2, minmax(0, 1fr));} }
@media (max-width:560px){ .panel{padding:16px 14px;} h1{font-size:1.8rem;} table.abil th, table.abil td{padding:5px 4px;} }
/* The Turnkeeper logo and name (the same mark as the character sheet's header) */
h1.brand{display:flex; align-items:center; justify-content:center; gap:14px;}
.brand-mark{width:1.25em; height:1.25em; flex:0 0 auto;}
/* Theme picker: a small, quiet "Theme" button that opens a menu of the themes
   (the same on the tracker and the hub; keep the two in step) */
.theme-picker{position:relative; display:flex; justify-content:center; margin-top:14px;}
button.theme-toggle{display:inline-flex; align-items:center; gap:5px; background:none; border:none; padding:4px 6px; border-radius:4px; color:var(--ink-dim); opacity:0.6; font-size:0.72rem; font-family:var(--font-body); cursor:pointer; box-shadow:none; text-shadow:none;}
button.theme-toggle:hover, button.theme-toggle[aria-expanded="true"]{background:none; opacity:1; color:var(--ink);}
button.theme-toggle svg{width:13px; height:13px;}
.theme-menu{
  position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); z-index:50;
  display:grid; grid-template-columns:repeat(3, auto); gap:4px 12px; padding:10px 12px;
  background:var(--panel); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.45);
}
.theme-group{grid-column:1 / -1; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--sea); border-top:1px solid var(--border); padding-top:8px; margin-top:4px;}
@media (max-width:520px){ .theme-menu{grid-template-columns:repeat(2, auto);} }
.theme-menu[hidden]{display:none;}
button.theme-option{display:flex; align-items:center; gap:8px; background:none; border:none; padding:4px 6px; border-radius:4px; color:var(--ink); font-size:0.78rem; font-family:var(--font-body); white-space:nowrap; cursor:pointer; box-shadow:none; text-shadow:none;}
button.theme-option:hover{background:var(--panel2);}
.theme-dot{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border); flex:0 0 auto;}
button.theme-option[aria-pressed="true"]{font-weight:600;}
button.theme-option[aria-pressed="true"] .theme-dot{border-color:var(--ink); box-shadow:0 0 0 2px var(--panel), 0 0 0 3px var(--ink);}
.brand-home{display:inline-flex; align-items:center; gap:8px; color:var(--sea); text-decoration:none; font-family:var(--font-display); font-size:1rem; margin-bottom:8px; opacity:0.85;}
.brand-home:hover{opacity:1;}
.brand-home .brand-mark{width:1.5em; height:1.5em;}
</style>
<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/account-store.js"></script>
<script src="js/themes.js"></script>
</head>

<div class="wrap">
  <header><a class="brand-home" href="index.html" title="Back to the hub"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="var(--sea)" stroke-width="2"/><path d="M14 11 H26 M14 29 H26 M15 11 Q15 18 20 20 Q25 18 25 11 M15 29 Q15 22 20 20 Q25 22 25 29" fill="none" stroke="var(--sea)" stroke-width="1.8" stroke-linejoin="round"/><path d="M17.5 27 Q20 24 22.5 27 Z" fill="var(--orange)"/></svg>Turnkeeper</a><h1>New Character</h1><div class="sub"><span id="forWhat">…</span> · <a href="index.html">back to the hub</a></div></header>
  <div class="layout">
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <div class="main">
      <main class="panel" id="body"><p class="note">Loading…</p></main>
      <div class="nav"><button type="button" class="btn ghost" id="back">Back</button><span class="todo" id="todo" aria-live="polite"></span><button type="button" class="btn" id="next">Next</button></div>
      <div class="foot"><button type="button" id="startOver">Start over</button></div>
    </div>
    <aside class="summary" id="summary" aria-label="Your character so far"></aside>
  </div>
  <div class="theme-picker" id="themePicker">
    <button type="button" class="theme-toggle" id="themeToggle" aria-expanded="false" aria-controls="themeMenu" title="Change the color theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 0 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5C21 6.4 17 3 12 3zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg><span>Theme</span></button>
    <div class="theme-menu" id="themeMenu" role="group" aria-label="Color theme" hidden></div>
  </div>
</div>
<div id="tooltip"></div>

<script src="js/data/equipment.js"></script>
<script src="js/data/backgrounds.js"></script>

<script src="js/data/classes.js"></script>
<script src="js/data/classes-phb.js"></script>
<script src="js/data/levels.js"></script>

<script>
// The Theme menu, as on the hub (js/themes.js builds it). The pick is this browser's main theme,
// shared with the hub.
// The Theme button opens and closes the menu; a click elsewhere or Escape closes it.
// It stays open after a pick so themes can be compared.
function showThemeMenu(open){
  document.getElementById('themeMenu').hidden = !open;
  document.getElementById('themeToggle').setAttribute('aria-expanded', String(open));
}
document.getElementById('themeToggle').addEventListener('click', ()=>showThemeMenu(document.getElementById('themeMenu').hidden));
// composedPath, not closest(): picking a theme rebuilds the menu, detaching the clicked button
document.addEventListener('click', e=>{ if(!e.composedPath().includes(document.getElementById('themePicker'))) showThemeMenu(false); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') showThemeMenu(false); });
renderThemeMenu();
</script>
